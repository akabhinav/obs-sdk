version: '3.8'

services:
  # Observability SDK Application
  obs-sdk-app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: obs-sdk-app
    environment:
      - OBSERVABILITY_CONFIG=/app/config-examples/prometheus-jaeger.yml
    volumes:
      - ../config-examples:/app/config-examples:ro
    depends_on:
      - prometheus
      - pushgateway
      - jaeger
      - otel-collector
    networks:
      - observability
    # Override to run different examples:
    # docker-compose -f docker-compose-full.yml run obs-sdk-app mvn exec:java -Dexec.mainClass=com.observability.examples.ComprehensiveExample

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: obs-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - observability

  # Prometheus Pushgateway
  pushgateway:
    image: prom/pushgateway:latest
    container_name: obs-pushgateway
    ports:
      - "9091:9091"
    networks:
      - observability

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: obs-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Collector HTTP
      - "14250:14250"  # Collector gRPC
      - "6831:6831/udp"  # Agent
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - observability

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: obs-otel-collector
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
      - "8888:8888"  # Prometheus metrics
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml
    command: ["--config=/etc/otel-collector-config.yml"]
    networks:
      - observability

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: obs-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      - prometheus
      - jaeger
    networks:
      - observability

  # Zipkin (alternative tracing)
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: obs-zipkin
    ports:
      - "9411:9411"
    networks:
      - observability

networks:
  observability:
    driver: bridge

volumes:
  grafana-storage:
