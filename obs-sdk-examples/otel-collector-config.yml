receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s

exporters:
  logging:
    loglevel: debug

  prometheus:
    endpoint: "0.0.0.0:8888"

  jaeger:
    endpoint: jaeger:14250
    tls:
      insecure: true

  zipkin:
    endpoint: "http://zipkin:9411/api/v2/spans"

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging, prometheus]

    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging, jaeger, zipkin]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]
