# AWS X-Ray Configuration (via OTLP Collector)
# Requires: AWS account and X-Ray enabled
# Authentication: AWS credentials configured

service:
  name: "my-service"
  version: "1.0.0"
  environment: "production"
  attributes:
    aws_region: "us-east-1"

# AWS X-Ray requires OpenTelemetry Collector as intermediary
# 1. Deploy OTLP Collector with AWS X-Ray exporter
# 2. Send OTLP to collector
# 3. Collector forwards to X-Ray

exporters:
  traces:
    - type: "otlp"
      enabled: true
      endpoint: "http://localhost:4318/v1/traces"  # OTLP Collector endpoint
      config:
        # Collector will handle AWS X-Ray format conversion
        target: "xray"

# OTLP Collector config (otel-collector-config.yml):
