# Dynatrace Configuration
# Sign up: https://www.dynatrace.com/
# Get API token from: Settings → Integration → OpenTelemetry

service:
  name: "my-service"
  version: "1.0.0"

exporters:
  metrics:
    - type: "otlp"
      enabled: true
      endpoint: "https://YOUR_ENVIRONMENT_ID.live.dynatrace.com/api/v2/otlp/v1/metrics"
      headers:
        Authorization: "Api-Token YOUR_API_TOKEN"

  traces:
    - type: "otlp"
      enabled: true
      endpoint: "https://YOUR_ENVIRONMENT_ID.live.dynatrace.com/api/v2/otlp/v1/traces"
      headers:
        Authorization: "Api-Token YOUR_API_TOKEN"

  logs:
    - type: "otlp"
      enabled: true
      endpoint: "https://YOUR_ENVIRONMENT_ID.live.dynatrace.com/api/v2/otlp/v1/logs"
      headers:
        Authorization: "Api-Token YOUR_API_TOKEN"
